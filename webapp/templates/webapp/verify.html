<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verify document - DigiDocker</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  .preview-wrap { position: relative; border: 1px solid #dee2e6; border-radius: .375rem; overflow: hidden; }
  .preview-wrap img, .preview-wrap iframe { width: 100%; height: 480px; object-fit: contain; background: #f8f9fa; }
  .watermark {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    pointer-events: none; font-size: 1.1rem; color: rgba(220,53,69,.35); font-weight: bold;
    transform: rotate(-20deg); text-align: center; user-select: none;
  }
</style>
</head>
<body class="bg-light">
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7">
      <div class="card shadow-sm">
        <div class="card-body text-center" id="result">Checking…</div>
      </div>
      <p class="text-center text-muted small mt-3">Aadhaar documents only ever show a verified badge here — the content is never shown, even to a valid link holder.</p>
    </div>
  </div>
</div>
<script>
const token = "{{ token }}";

fetch(`/api/documents/verify/${token}/`)
  .then(res => {
    if (!res.ok) throw new Error('not found');
    return res.json();
  })
  .then(doc => {
    const badge = doc.status === 'VERIFIED'
      ? '<span class="badge bg-success fs-6">✔ VERIFIED</span>'
      : '<span class="badge bg-secondary fs-6">UNVERIFIED</span>';

    const previewHtml = doc.preview_available ? `
      <div class="preview-wrap my-3">
        <iframe src="/api/documents/verify/${token}/preview/"></iframe>
        <div class="watermark">Shared for verification only<br>${new Date().toLocaleString()}</div>
      </div>` : '<p class="text-muted small my-3">No public preview for this document type.</p>';

    document.getElementById('result').innerHTML = `
      <h4>${doc.title}</h4>
      <p class="text-muted">${doc.doc_type}</p>
      ${badge}
      ${previewHtml}
      <hr>
      <p class="mb-1"><strong>Issued by:</strong> ${doc.issuer || 'N/A'}</p>
      <p class="mb-1"><strong>Holder:</strong> ${doc.owner_name}</p>
      <p class="text-muted small mb-1">Issued: ${doc.issued_at ? new Date(doc.issued_at).toLocaleString() : 'N/A'}</p>
      <p class="text-muted small">Link expires ${new Date(doc.expires_at).toLocaleString()} · ${doc.views_remaining} view(s) left</p>
    `;
  })
  .catch(() => {
    document.getElementById('result').innerHTML = '<p class="text-danger">This verification link is invalid, expired, or has been revoked.</p>';
  });
</script>
</body>
</html>
