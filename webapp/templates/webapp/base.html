<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}DigiDocker{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/static/webapp/style.css">
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="/">🔒 DigiDocker</a>
    <span id="nav-user" class="text-light small"></span>
    <button id="nav-logout" class="btn btn-sm btn-outline-light d-none" onclick="logout()">Logout</button>
  </div>
</nav>
<div class="container pb-5">
  {% block content %}{% endblock %}
</div>
<script src="/static/webapp/api.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
